# Copied Sites are standalone projects and cannot inherit the monorepo policy.
# Release-age quarantine disabled for standalone/CI deploys (e.g. Netlify).
# The managed authoring environment can verify each package's publish date, but
# generic CI reads abbreviated registry metadata without those timestamps, so the
# check rejects the entire already-pinned lockfile and fails `pnpm install`. The
# lockfile still pins exact versions, so which versions install is unchanged.
minimumReleaseAge: 0
minimumReleaseAgeIgnoreMissingTime: true
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# A later project-only session must not mutate a shared-store inode through node_modules.
packageImportMethod: clone-or-copy
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.4
